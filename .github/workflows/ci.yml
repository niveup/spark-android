name: CI

# Phase 0 rule: lint + unit tests on every push.
# No Gradle wrapper in repo (Studio builds locally), so CI installs
# Gradle 9.6.0 directly — same version as gradle/wrapper/gradle-wrapper.properties.
# Runner already has Android SDK + Java setup; we add JDK 17 and the
# exact platform/build-tools this project uses (see local SDK: android-37, 36.0.0).

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.6.0
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Install Android packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Lint and unit tests
        run: gradle :app:lintDebug :app:testDebugUnitTest --console=plain
