name: CI

# Phase 0 rule: lint + unit tests on every push.
# Gradle wrapper is committed (9.6.0) and checksum-pinned; CI uses it directly.
# Runner already has Android SDK + Java setup; we add JDK 17 and the
# exact platform/build-tools this project uses (see local SDK: android-37, 36.0.0).
# API integration tests (api/test/api.test.ts) need a running dev server + the
# DEV database, so CI runs only the pure-logic API unit tests (test:unit).

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Lint, unit tests, and coverage floor
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:koverVerifyDebug --console=plain

  api-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: API unit tests
        run: npm run test:unit
