[versions]
# Sources: AGP 9.4 release notes (developer.android.com/build/releases/gradle-plugin),
# Compose setup page (BOM 2026.08.00). Kotlin pairs with Compose compiler plugin.
# Network/security versions checked live against Maven Central + Google Maven (Oct 2026).
# Retrofit 3.0.0 itself depends on OkHttp 4.12.0 (see its POM) — pinned as a pair.
agp = "9.3.0"
kotlin = "2.2.0"
composeBom = "2026.08.00"
coreKtx = "1.16.0"
lifecycle = "2.9.1"
activityCompose = "1.10.1"
junit = "4.13.2"
retrofit = "3.0.0"
okhttp = "4.12.0"
serialization = "1.11.0"
navigation = "2.10.2"
securityCrypto = "1.1.0"
# Media3 verified live against Google Maven (Oct 2026): 1.11.1 is the latest stable.
media3 = "1.11.1"
# Room verified live against Google Maven (Oct 2026): 2.8.5 latest stable.
# KSP must match the Kotlin version the build actually uses — AGP 9.3 pulls
# Kotlin Gradle plugin 2.2.10, and KSP refuses older pairings. 2.2.10-2.0.2
# verified live on Maven Central (Oct 2026). Room needs KSP.
room = "2.8.5"
ksp = "2.2.10-2.0.2"
# Coroutines test utilities (JVM tests for the Phase 7 sync persistence).
coroutinesTest = "1.11.0"
# Sentry crash reporting (Phase 8). The SDK and the Gradle plugin are versioned
# SEPARATELY by Sentry — the plugin is NOT the SDK version. Verified live on
# Maven Central (Oct 2026): sentry-android 8.61.0, plugin 6.24.0.
sentry = "8.61.0"
sentryGradlePlugin = "6.24.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# Sentry: BOM pins every io.sentry:* artifact to the same version.
sentry-bom = { group = "io.sentry", name = "sentry-bom", version.ref = "sentry" }
sentry-android = { group = "io.sentry", name = "sentry-android", version.ref = "sentry" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
sentry-android-gradle = { id = "io.sentry.android.gradle", version.ref = "sentryGradlePlugin" }
