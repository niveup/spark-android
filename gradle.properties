# Weak-PC tuned: small heap, parallel, caching. No emulator.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Configuration cache OFF: it silently drops the adbReverseDev -> preBuild
# dependency (task-realization callbacks), which broke the USB tunnel helper.
# Revisit in a later phase with the documented config-cache pattern.
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# KSP still registers its generated dirs through the kotlin.sourceSets DSL,
# which AGP 9's built-in Kotlin rejects (google/ksp#2729). Until KSP moves to
# the androidComponents variant API, this flag is the documented workaround
# (developer.android.com "Migrate to built-in Kotlin"). Needed for Room.
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
